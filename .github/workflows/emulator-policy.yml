name: Emulator policy (AOSP ATD)

# Phase 5 (issue #47). Runs scripts/emulator-policy-disallow-add-user.sh on a
# GitHub-hosted ubuntu-latest runner with KVM. The image is the AOSP ATD
# Android 15 emulator (system-images;android-35;aosp_atd;x86_64). It is not
# GrapheneOS, and attestation is not asserted.
#
# Boot retry: the emulator-runner step runs once. If it fails before
# scripts/ci-emulator-policy.sh creates /tmp/mdm-ci/script-started, the same
# step runs one more time. A second failure fails the job. A leg that already
# started is not retried.

on:
  pull_request:
    paths:
      - scripts/emulator-policy-disallow-add-user.sh
      - scripts/ci-emulator-policy.sh
      - server/**
      - app/**
      - protocol/**
      - build.gradle.kts
      - settings.gradle.kts
      - gradle.properties
      - gradle/**
      - .github/workflows/emulator-policy.yml
  push:
    branches: [main]
    paths:
      - scripts/emulator-policy-disallow-add-user.sh
      - scripts/ci-emulator-policy.sh
      - server/**
      - app/**
      - protocol/**
      - build.gradle.kts
      - settings.gradle.kts
      - gradle.properties
      - gradle/**
      - .github/workflows/emulator-policy.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emulator-policy-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  emulator-policy:
    name: AOSP ATD emulator policy (disallowAddUser)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LOGDIR: /tmp/mdm-ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: "8.9"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Build testOnly debug APK (before the emulator boots)
        run: gradle --no-daemon --console=plain :app:assembleDebug -Pandroid.injected.testOnly=true

      - name: Run operate script legs on the emulator
        id: emu
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: aosp_atd
          arch: x86_64
          avd-name: mdm36
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash scripts/ci-emulator-policy.sh

      - name: Classify emulator step
        id: emu-classify
        if: always()
        run: |
          set -euo pipefail
          outcome="${{ steps.emu.outcome }}"
          echo "emulator step outcome=$outcome"
          if [ "$outcome" = "success" ]; then
            echo "retry=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -f /tmp/mdm-ci/script-started ]; then
            echo "The operate script started, so this is not a boot failure. Not retrying."
            echo "retry=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "Emulator step failed before the operate script. One boot retry."
          echo "retry=true" >> "$GITHUB_OUTPUT"

      - name: Retry emulator boot once
        id: emu-retry
        if: steps.emu-classify.outputs.retry == 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: aosp_atd
          arch: x86_64
          avd-name: mdm36
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash scripts/ci-emulator-policy.sh

      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: emulator-policy-logs
          path: |
            /tmp/mdm-ci/
            !/tmp/mdm-ci/**/certs/**
            !/tmp/mdm-ci/**/*.pem
            !/tmp/mdm-ci/**/*.p12
            !/tmp/mdm-ci/**/*.key
            !/tmp/mdm-ci/**/*.crt
          if-no-files-found: warn
          retention-days: 14
