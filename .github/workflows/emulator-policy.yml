name: Emulator policy (AOSP ATD)

# Phase 5 (issue #47), Phase 6 (issue #49), and Phase 7 (issue #51). Runs
# scripts/emulator-policy-restriction.sh on a GitHub-hosted
# ubuntu-latest runner with KVM, for disallowAddUser and
# disallowFactoryReset. The image is the AOSP ATD Android 15 emulator
# (system-images;android-35;aosp_atd;x86_64). It is not GrapheneOS, and
# attestation is not asserted. The script does not factory-reset or wipe.
#
# Boot retry: the emulator-runner step runs once. If it fails before
# scripts/ci-emulator-policy.sh creates /tmp/mdm-ci/script-started, the same
# step runs one more time. A second failure fails the job. A leg that already
# started is not retried.

on:
  pull_request:
    paths:
      - scripts/emulator-policy-restriction.sh
      - scripts/ci-emulator-policy.sh
      - scripts/lib/**
      - server/**
      - app/**
      - protocol/**
      - build.gradle.kts
      - settings.gradle.kts
      - gradle.properties
      - gradle/**
      - .github/workflows/emulator-policy.yml
  push:
    branches: [main]
    paths:
      - scripts/emulator-policy-restriction.sh
      - scripts/ci-emulator-policy.sh
      - scripts/lib/**
      - server/**
      - app/**
      - protocol/**
      - build.gradle.kts
      - settings.gradle.kts
      - gradle.properties
      - gradle/**
      - .github/workflows/emulator-policy.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emulator-policy-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  emulator-policy:
    name: AOSP ATD emulator policy (disallowAddUser, disallowFactoryReset)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LOGDIR: /tmp/mdm-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: "8.9"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build testOnly debug APK (before the emulator boots)
        run: gradle --no-daemon --console=plain :app:assembleDebug -Pandroid.injected.testOnly=true

      - name: Run operate script legs on the emulator
        id: emu
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: aosp_atd
          arch: x86_64
          avd-name: mdm36
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash scripts/ci-emulator-policy.sh

      - name: Classify emulator step
        id: emu-classify
        if: always()
        run: |
          set -euo pipefail
          outcome="${{ steps.emu.outcome }}"
          echo "emulator step outcome=$outcome"
          if [ "$outcome" = "success" ]; then
            echo "retry=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -f /tmp/mdm-ci/script-started ]; then
            echo "The operate script started, so this is not a boot failure. Not retrying."
            echo "retry=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "Emulator step failed before the operate script. One boot retry."
          echo "retry=true" >> "$GITHUB_OUTPUT"

      - name: Retry emulator boot once
        id: emu-retry
        if: steps.emu-classify.outputs.retry == 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: aosp_atd
          arch: x86_64
          avd-name: mdm36
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash scripts/ci-emulator-policy.sh

      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emulator-policy-logs
          # *.bks is the BouncyCastle keystore. scripts/lib/cert-guard.sh lists -name '*.bks'.
          path: |
            /tmp/mdm-ci/
            !/tmp/mdm-ci/**/certs/**
            !/tmp/mdm-ci/**/*.pem
            !/tmp/mdm-ci/**/*.p12
            !/tmp/mdm-ci/**/*.key
            !/tmp/mdm-ci/**/*.crt
            !/tmp/mdm-ci/**/*.der
            !/tmp/mdm-ci/**/*.cer
            !/tmp/mdm-ci/**/*.pfx
            !/tmp/mdm-ci/**/*.jks
            !/tmp/mdm-ci/**/*.keystore
            !/tmp/mdm-ci/**/*.csr
            !/tmp/mdm-ci/**/*.bks
            !/tmp/mdm-ci/**/fleet.sqlite*
          if-no-files-found: warn
          retention-days: 14
