name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

jobs:
  protocol-and-lab:
    name: Protocol schemas + lab check-in
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Schema smoke tests
        run: python3 -m unittest discover -s protocol/tests -v
      - name: Lab mTLS check-in tests
        run: python3 -m unittest discover -s server/tests -v

  android-unit:
    name: Android unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: tools platform-tools platforms;android-35 build-tools;35.0.0
      - name: Unit tests
        run: gradle --no-daemon test
