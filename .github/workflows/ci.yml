name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

jobs:
  protocol-and-lab:
    name: Protocol schemas + lab check-in
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Schema smoke tests
        run: python3 -m unittest discover -s protocol/tests -v
      - name: Lab mTLS check-in tests
        run: python3 -m unittest discover -s server/tests -v

  android-unit:
    name: Android unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Ensure Gradle wrapper jar
        run: |
          mkdir -p gradle/wrapper
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
              https://raw.githubusercontent.com/gradle/gradle/v8.9.0/gradle/wrapper/gradle-wrapper.jar
          fi
          chmod +x gradlew
      - uses: android-actions/setup-android@v3
      - name: Unit tests
        run: ./gradlew --no-daemon test
